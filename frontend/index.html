<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A community college hackathon platform — build, ship and demo together." />
    <meta name="theme-color" content="#030504" />
    <meta name="color-scheme" content="dark" />

    <!-- Fonts: Space Grotesk (display) + Inter (body). System fallbacks are defined in CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Hackathon Platform</title>

    <!-- Apply the saved theme before paint to avoid a flash of the wrong theme.
         Dark is the designed default — only an explicit "light" choice wins. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('hackathon-theme')
          if (t !== 'light') document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body style="background:#030504">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
